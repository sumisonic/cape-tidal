name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - "27.1"
          - "release-snapshot"
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Byte-compile (must be warning-free)
        run: |
          emacs -Q --batch \
            --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile cape-tidal.el

      - name: Run ERT
        run: |
          emacs -Q --batch -L . \
            -l cape-tidal.el -l test/cape-tidal-test.el \
            -f ert-run-tests-batch-and-exit
